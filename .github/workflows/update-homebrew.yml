name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Get tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download tarball and compute SHA256
        id: sha
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          curl -sL "https://github.com/tfcace/hash/archive/refs/tags/${TAG}.tar.gz" -o hash.tar.gz
          SHA256=$(sha256sum hash.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          SHA256="${{ steps.sha.outputs.sha256 }}"

          git clone https://x-access-token:${GH_TOKEN}@github.com/tfcace/homebrew-hash.git
          cd homebrew-hash

          cat > Formula/hash.rb << 'FORMULA'
          class Hash < Formula
            desc "AI-powered shell with ACP integration"
            homepage "https://github.com/tfcace/hash"
            url "URL_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"
            license "MIT"

            depends_on "go" => :build

            def install
              commit = `git rev-parse --short HEAD`.strip
              ldflags = %W[
                -X github.com/tfcace/hash/internal/version.Version=#{version}
                -X github.com/tfcace/hash/internal/version.GitCommit=#{commit}
                -X github.com/tfcace/hash/internal/version.JjChange=unknown
                -X github.com/tfcace/hash/internal/version.BuildDate=#{Time.now.utc.strftime("%Y-%m-%d")}
              ]
              system "go", "build", *std_go_args(ldflags:), "./cmd/hash"
            end

            def caveats
              <<~EOS
                To use hash as your login shell:
                  sudo sh -c 'echo #{opt_bin}/hash >> /etc/shells'
                  chsh -s #{opt_bin}/hash
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hash --version")
            end
          end
          FORMULA

          # Replace placeholders
          sed -i "s|URL_PLACEHOLDER|https://github.com/tfcace/hash/archive/refs/tags/${TAG}.tar.gz|g" Formula/hash.rb
          sed -i "s|SHA256_PLACEHOLDER|${SHA256}|g" Formula/hash.rb

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/hash.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hash.rb
          git commit -m "Update hash to ${VERSION}"
          git push
