name: Release

on:
  push:

permissions:
  contents: write
  pull-requests: write

# Prevent concurrent release-please runs to avoid duplicate PRs
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev xvfb

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -coverprofile=coverage.txt ./...

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: go test -coverprofile=coverage.txt ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run vet
        run: go vet ./...

  release-please:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev gcc-aarch64-linux-gnu

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run GoReleaser (build only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --id hash-${{ matrix.goos }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create archives
        run: |
          cd dist
          for dir in hash-${{ matrix.goos }}_*/; do
            name="${dir%/}"
            # Extract os and arch from directory name (e.g., hash-linux_linux_amd64_v1)
            # Remove the build id prefix and any arch version suffix (_v1, _v8.0, etc.)
            os_arch="${name#hash-${{ matrix.goos }}_}"
            os_arch=$(echo "$os_arch" | sed 's/_v[0-9.]*$//')
            archive_name="hash_${{ needs.release-please.outputs.tag_name }}_${os_arch}.tar.gz"
            tar -czvf "$archive_name" -C "$dir" hash
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}
          path: dist/*.tar.gz
          retention-days: 1

  goreleaser-release:
    needs: [release-please, goreleaser-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-linux
          path: dist

      - name: Download Darwin artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-darwin
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} dist/*.tar.gz dist/checksums.txt --clobber

      - name: Apply curated release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          NOTES_FILE="docs/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            echo "::warning::Curated release notes not found: ${NOTES_FILE}"
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          TAG="${{ needs.release-please.outputs.tag_name }}"

          # Calculate SHA256 for each archive (using explicit names)
          DARWIN_AMD64_SHA=$(sha256sum "dist/hash_${TAG}_darwin_amd64.tar.gz" | cut -d' ' -f1)
          DARWIN_ARM64_SHA=$(sha256sum "dist/hash_${TAG}_darwin_arm64.tar.gz" | cut -d' ' -f1)
          LINUX_AMD64_SHA=$(sha256sum "dist/hash_${TAG}_linux_amd64.tar.gz" | cut -d' ' -f1)
          LINUX_ARM64_SHA=$(sha256sum "dist/hash_${TAG}_linux_arm64.tar.gz" | cut -d' ' -f1)

          # Generate formula
          cat > hash.rb <<EOF
          class Hash < Formula
            desc "AI-powered shell with ACP integration"
            homepage "https://github.com/tfcace/hash"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/tfcace/hash/releases/download/${TAG}/hash_${TAG}_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              else
                url "https://github.com/tfcace/hash/releases/download/${TAG}/hash_${TAG}_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/tfcace/hash/releases/download/${TAG}/hash_${TAG}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              else
                url "https://github.com/tfcace/hash/releases/download/${TAG}/hash_${TAG}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "hash"
            end

            def caveats
              <<~EOS
                To use hash as your login shell:
                  sudo sh -c 'echo #{opt_bin}/hash >> /etc/shells'
                  chsh -s #{opt_bin}/hash
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hash --version")
            end
          end
          EOF

          # Strip leading whitespace from formula
          sed -i 's/^          //' hash.rb

          # Use gh to commit the formula to the tap repo
          # First try without sha (new file), then with sha (update existing)
          SHA=$(gh api repos/tfcace/homebrew-hash/contents/Formula/hash.rb --jq .sha 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            gh api repos/tfcace/homebrew-hash/contents/Formula/hash.rb \
              --method PUT \
              -f message="Brew formula update for hash version ${TAG}" \
              -f content="$(base64 -w0 hash.rb)" \
              -f branch=main
          else
            gh api repos/tfcace/homebrew-hash/contents/Formula/hash.rb \
              --method PUT \
              -f message="Brew formula update for hash version ${TAG}" \
              -f content="$(base64 -w0 hash.rb)" \
              -f sha="$SHA" \
              -f branch=main
          fi
