name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go

  build-and-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%d)

          LDFLAGS="-X main.version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X main.gitCommit=${GIT_COMMIT}"
          LDFLAGS="${LDFLAGS} -X main.jjChange=unknown"
          LDFLAGS="${LDFLAGS} -X main.buildDate=${BUILD_DATE}"

          go build -ldflags "${LDFLAGS}" -o hash ./cmd/hash
          ./hash --version

      - name: Run tests
        run: go test ./...

  update-homebrew:
    needs: [release-please, build-and-release]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"

          # Download tarball and compute SHA256
          curl -sL "https://github.com/tfcace/hash/archive/refs/tags/${TAG}.tar.gz" -o hash.tar.gz
          SHA256=$(sha256sum hash.tar.gz | cut -d' ' -f1)

          # Clone homebrew-hash repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/tfcace/homebrew-hash.git
          cd homebrew-hash

          # Update formula
          cat > Formula/hash.rb << EOF
          class Hash < Formula
            desc "AI-powered shell with ACP integration"
            homepage "https://github.com/tfcace/hash"
            url "https://github.com/tfcace/hash/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "go" => :build

            def install
              commit = \`git rev-parse --short HEAD\`.strip
              ldflags = %W[
                -X main.version=#{version}
                -X main.gitCommit=#{commit}
                -X main.jjChange=unknown
                -X main.buildDate=#{Time.now.utc.strftime("%Y-%m-%d")}
              ]
              system "go", "build", *std_go_args(ldflags:), "./cmd/hash"
            end

            def caveats
              <<~EOS
                To use hash as your login shell:
                  sudo sh -c 'echo #{opt_bin}/hash >> /etc/shells'
                  chsh -s #{opt_bin}/hash
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hash --version")
            end
          end
          EOF

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hash.rb
          git commit -m "Update hash to ${VERSION}"
          git push
