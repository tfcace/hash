version: 2

before:
  hooks:
    - go mod tidy

builds:
  # Linux builds - run on Linux runner with cross-compiler for ARM64
  - id: hash-linux
    main: ./cmd/hash
    binary: hash
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/tfcace/hash/internal/version.Version={{.Version}}
      - -X github.com/tfcace/hash/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/tfcace/hash/internal/version.JjChange=unknown
      - -X github.com/tfcace/hash/internal/version.BuildDate={{.Date}}
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=gcc
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc

  # macOS builds - run on macOS runner (native toolchain)
  - id: hash-darwin
    main: ./cmd/hash
    binary: hash
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/tfcace/hash/internal/version.Version={{.Version}}
      - -X github.com/tfcace/hash/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/tfcace/hash/internal/version.JjChange=unknown
      - -X github.com/tfcace/hash/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github-native

release:
  github:
    owner: tfcace
    name: hash
  draft: false
  prerelease: auto
  mode: replace
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew install tfcace/hash/hash
    ```

    ### Manual
    Download the appropriate archive for your platform, extract, and add to your PATH.

brews:
  - name: hash
    repository:
      owner: tfcace
      name: homebrew-hash
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/tfcace/hash"
    description: "AI-powered shell with ACP integration"
    license: "MIT"
    install: |
      bin.install "hash"
    caveats: |
      To use hash as your login shell:
        sudo sh -c 'echo #{opt_bin}/hash >> /etc/shells'
        chsh -s #{opt_bin}/hash
    test: |
      assert_match version.to_s, shell_output("#{bin}/hash --version")
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
