version: "2"

formatters:
  enable:
    - gofmt

linters:
  enable:
    # Default linters (gosimple merged into staticcheck in v2)
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign

    # Security - critical for a shell that executes commands
    - gosec          # Security vulnerabilities, command injection patterns

    # Error handling - shells must handle errors robustly
    - nilerr         # Returning nil when err != nil

    # Resource management
    - gocritic       # Broad set of code quality checks
    - unconvert      # Unnecessary type conversions

    # Code quality
    - misspell       # Spelling errors in comments/strings

  settings:
    errcheck:
      exclude-functions:
        # Standard print functions (fire-and-forget terminal output)
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Scanln
        # Writer interface (terminal I/O)
        - (io.Writer).Write
        - (*os.File).Write
        - (*os.File).WriteString
        - (*os.File).Close
        - (*os.File).Sync
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).Flush
        # Closer interface
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        # Terminal control
        - golang.org/x/term.Restore
        # PTY operations
        - github.com/creack/pty.Setsize
        # Environment
        - os.Setenv
        - os.Unsetenv
        - os.Chdir
        # File cleanup
        - os.Remove

    gosec:
      excludes:
        - G104  # Unhandled errors (covered by errcheck)
        - G204  # Subprocess with variable - expected for a shell
        - G304  # File inclusion via variable - expected for a shell
        - G101  # Hardcoded credentials - false positives in tests

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - whyNoLint
        - hugeParam

    misspell:
      locale: US

  exclusions:
    rules:
      # Exclude from test files - tests use simplified patterns
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - govet
          - gocritic

run:
  timeout: 5m
  build-tags:
    - integration
