version: "2"

formatters:
  enable:
    - gofmt

linters:
  enable:
    # Default linters (gosimple merged into staticcheck in v2)
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign

    # Security - critical for a shell that executes commands
    - gosec          # Security vulnerabilities, command injection patterns

    # Error handling - shells must handle errors robustly
    - nilerr         # Returning nil when err != nil

    # Resource management
    - gocritic       # Broad set of code quality checks
    - unconvert      # Unnecessary type conversions

    # Code quality
    - misspell       # Spelling errors in comments/strings

linters-settings:
  errcheck:
    check-tests: false
    exclude-functions:
      - (io.Writer).Write
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Print
      - fmt.Println
      - fmt.Printf
      - fmt.Sscanf

  gosec:
    excludes:
      - G104
    config:
      G204:
        audit: true

  govet:
    enable-all: true
    disable:
      - fieldalignment

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - whyNoLint
      - hugeParam

  misspell:
    locale: US

run:
  timeout: 5m
  build-tags:
    - integration

exclusions:
  paths:
    - internal/editor
    - internal/compat
  rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocritic
    - path: cmd/hash/main\.go
      linters:
        - errcheck
