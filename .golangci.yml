version: "2"

formatters:
  enable:
    - gofmt

linters:
  enable:
    # Default linters (gosimple merged into staticcheck in v2)
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign

    # Security - critical for a shell that executes commands
    - gosec          # Security vulnerabilities, command injection patterns

    # Error handling - shells must handle errors robustly
    - nilerr         # Returning nil when err != nil

    # Resource management
    - gocritic       # Broad set of code quality checks
    - unconvert      # Unnecessary type conversions

    # Code quality
    - misspell       # Spelling errors in comments/strings

linters-settings:
  errcheck:
    check-tests: false
    exclude-functions:
      # Standard print functions (fire-and-forget terminal output)
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Print
      - fmt.Println
      - fmt.Printf
      - fmt.Sscanf
      # Writer interface (terminal I/O)
      - io.Writer.Write
      - (io.Writer).Write
      - (*os.File).Write
      - (*os.File).WriteString
      - (*os.File).Close
      - (*os.File).Sync
      - os.Stdout.WriteString
      - os.Stderr.WriteString
      - (*bytes.Buffer).Write
      - (*bytes.Buffer).WriteString
      - (*strings.Builder).Write
      - (*strings.Builder).WriteString
      - (*bufio.Writer).Write
      - (*bufio.Writer).WriteString
      - (*bufio.Writer).Flush
      # Closer interface
      - io.Closer.Close
      - (io.Closer).Close
      # Terminal control
      - term.Restore
      - golang.org/x/term.Restore
      # PTY operations
      - pty.Setsize
      - github.com/creack/pty.Setsize
      # JSON parsing
      - json.Unmarshal
      - encoding/json.Unmarshal
      # Environment
      - os.Setenv
      - os.Unsetenv
      - os.Chdir
    # Exclude patterns for method calls on interfaces
    exclude:
      - "Error return value of .((os\\.)?std(out|err)\\..*|fmt\\..*|.*\\.Write.*|.*\\.Close|.*Close\\(\\)|term\\.Restore|pty\\.Setsize|json\\.Unmarshal|os\\.(Setenv|Unsetenv|Chdir)).* is not checked"

  gosec:
    excludes:
      - G104  # Unhandled errors (covered by errcheck)
      - G204  # Subprocess with variable - expected for a shell
      - G304  # File inclusion via variable - expected for a shell
      - G101  # Hardcoded credentials - false positives in tests

  govet:
    enable-all: true
    disable:
      - fieldalignment

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - whyNoLint
      - hugeParam

  misspell:
    locale: US

run:
  timeout: 5m
  build-tags:
    - integration
